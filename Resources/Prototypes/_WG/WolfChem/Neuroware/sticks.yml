# Neuroware sticks. A blank takes copies; the named ones are pristine builds. Copying leaves the source's loads
# alone, so a build spreads as far as there are blanks, 15% worse each generation. A stick's price doesn't follow
# what is copied onto it, so copying doesn't print money. A blank that takes a copy becomes a narcotic at the market
# like the program base (WGNarcoticMarks).

- type: entity
  parent: BaseItem
  id: WGNeurowareStick
  components:
  - type: Sprite
    sprite: _WG/WolfChem/Neuroware/Objects/stick.rsi
    layers:
    - state: body
      color: "#8c8c90"
    - state: plug
    - state: tape
      map: [ "tape" ]
      visible: false
    - state: led
      shader: unshaded
      map: [ "led" ]
      visible: false
  # A blank that takes a copy gets a strip of tape and lights up.
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WGNeurowareStickVisuals.Copied:
        tape:
          True: { visible: true }
          False: { visible: false }
        led:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Tiny
  - type: WGNeurowareStick
    loads: 0
  - type: StaticPrice
    price: 75

# A stick with a program on it. It sells like any drug.
