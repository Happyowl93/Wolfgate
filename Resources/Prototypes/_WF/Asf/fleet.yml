# Hulls adapted from Hullrot: Eclipsion's DSM ships by Tools/_WF/Asf/port_dsm_hulls.py.
# Prices and loadouts are set against other factions' hulls of similar tile count; see Docs/_WF/Asf/README.md.

- type: vessel
  id: WFAsfGleaner
  parent: BaseVessel
  name: ASF Gleaner
  description: A one-seat Federation mining pod with two kinetic mining guns and an ore magnet. Unarmed otherwise; it is built to bring rock home, not to fight over it.
  price: 25000
  category: Micro
  group: Custom
  shuttlePath: /SharedMaps/_WF/Asf/gleaner.yml
  guidebookPage: null
  class:
  - Salvage
  engine:
  - Plasma

- type: gameMap
  id: WFAsfGleaner
  mapName: 'ASF Gleaner'
  mapPath: /SharedMaps/_WF/Asf/gleaner.yml
  minPlayers: 0
  stations:
    WFAsfGleaner:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Gleaner ASF{1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs:
          WFAsfEnforcer: [ 0, 0 ]
          WFAsfFieldResearcher: [ 0, 0 ]
          WFAsfColonist: [ 0, 0 ]

