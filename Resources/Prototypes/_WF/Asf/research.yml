# ASF ship vouchers and coilguns are researched on Lantern Post's server and printed at its fabricator, like other factions' LPCs.

- type: techDiscipline
  id: WFAsf
  name: wf-asf-research-discipline
  color: "#A66BE0"
  icon:
    sprite: _WF/Asf/Structures/Banners/federation.rsi
    state: asf-federation-banner
  tierPrerequisites:
    1: 0
    2: 0.5
    3: 0.5
  uiName: ASF

- type: technology
  id: WFAsfLPCCivilian
  name: wf-asf-research-lpc-civilian
  entityIcon: WFAsfVoucherCivilian
  discipline: WFAsf
  tier: 1
  cost: 10000
  recipeUnlocks:
  - WFAsfVoucherCivilian
  technologyPrerequisites:
  - UniversalMaterialResearchT1
  position: -5, -7

- type: technology
  id: WFAsfLPCEscort
  name: wf-asf-research-lpc-escort
  entityIcon: WFAsfVoucherEscort
  discipline: WFAsf
  tier: 1
  cost: 20000
  recipeUnlocks:
  - WFAsfVoucherEscort
  technologyPrerequisites:
  - WFAsfLPCCivilian
  position: -6, -7

- type: technology
  id: WFAsfLPCLodestar
  name: wf-asf-research-lpc-lodestar
  entityIcon: WFAsfVoucherLodestar
  discipline: WFAsf
  tier: 2
  cost: 40000
  recipeUnlocks:
  - WFAsfVoucherLodestar
  technologyPrerequisites:
  - WFAsfLPCEscort
  - UniversalMaterialResearchT2
  position: -6, -15

- type: technology
  id: WFAsfCoilArms
  name: wf-asf-research-coil-arms
  entityIcon: WFAsfWeaponRifleCoil
  discipline: WFAsf
  tier: 1
  cost: 15000
  recipeUnlocks:
  - WFAsfWeaponPistolCoil
  - WFAsfWeaponRifleCoil
  - WFAsfMagazinePistolCoil
  - WFAsfMagazineRifleCoil
  technologyPrerequisites:
  - UniversalMaterialResearchT1
  position: -4, -7

- type: latheRecipe
  parent: BaseVoucherRecipe
  id: WFAsfVoucherCivilian
  result: WFAsfVoucherCivilian
  completetime: 20
  materials:
    Steel: 5000
    Copper: 2500
    Plasteel: 2500
    Glass: 2500

- type: latheRecipe
  parent: BaseVoucherRecipe
  id: WFAsfVoucherEscort
  result: WFAsfVoucherEscort
  completetime: 30
  materials:
    Steel: 5000
    Copper: 5000
    Plasteel: 5000
    Glass: 5000
    Plasma: 2500

- type: latheRecipe
  parent: BaseVoucherRecipe
  id: WFAsfVoucherLodestar
  result: WFAsfVoucherLodestar
  completetime: 100
  materials: # matches the TSF tier-2 LPC; the Lodestar is a flagship
    Steel: 10000
    Copper: 10000
    Plasteel: 5000
    Lithium: 10000
    Glass: 5000
    Plasma: 5000
    Gold: 5000
    Silver: 5000
    Plastitanium: 1000

- type: latheRecipe
  parent: BaseWeaponRecipe
  id: WFAsfWeaponPistolCoil
  result: WFAsfWeaponPistolCoil
  categories:
  - Sidearms
  - Ballistic
  - Weapons
  materials:
    Steel: 600
    Plastic: 300
    Copper: 300 # the coil windings

- type: latheRecipe
  parent: BaseWeaponRecipeLong
  id: WFAsfWeaponRifleCoil
  result: WFAsfWeaponRifleCoil
  categories:
  - Rifles
  - Ballistic
  - Weapons
  materials:
    Steel: 1200
    Plasteel: 1000
    Plastic: 900
    Copper: 800

- type: latheRecipe
  parent: BaseAmmoFMJPistolCaliberPistolMagazineRecipe
  id: WFAsfMagazinePistolCoil
  result: WFAsfMagazinePistolCoil

- type: latheRecipe
  parent: BaseAmmoFMJIntermediateMagazineRecipe
  id: WFAsfMagazineRifleCoil
  result: WFAsfMagazineRifleCoil

- type: latheRecipePack
  id: WFAsfResearch
  recipes:
  - WFAsfVoucherCivilian
  - WFAsfVoucherEscort
  - WFAsfVoucherLodestar
  - WFAsfWeaponPistolCoil
  - WFAsfWeaponRifleCoil
  - WFAsfMagazinePistolCoil
  - WFAsfMagazineRifleCoil

- type: entity
  id: WFAsfResearchServer
  parent: BaseRdServerFaction
  components:
  - type: TechnologyDatabase
    supportedDisciplines:
    - WFAsf
    - FactionUniversal
    - Industrial
    - Arsenal
    - Experimental
    - CivilianServices
    - MechaEngineering

- type: entity
  id: WFAsfLathe
  parent: [BaseLatheLube, BaseStructureDisableToolUse]
  components:
  - type: Sprite
    sprite: _Mono/Structures/Machines/techfab.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - sprite: _WF/Asf/Structures/fabricator.rsi
      state: techfab-asf
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: ProtolatheMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/circuitprinter.ogg
    idleState: icon
    runningState: icon
    staticPacks:
    - RoundstartShipgunAmmo
    dynamicPacks:
    - WFAsfResearch
    # universal shipgun ammo, as on every faction lathe
    - UniversalRailgunAmmo
    - UniversalMissileAmmo
    - UniversalShellAmmo
    - UniversalOrdinance
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: RequireProjectileTarget
