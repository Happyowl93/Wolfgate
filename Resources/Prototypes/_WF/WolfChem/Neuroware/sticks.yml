# Neuroware sticks. A blank takes copies; the named ones are pristine builds. Copying leaves the source's loads
# alone, so a build spreads as far as there are blanks, 15% worse each generation. A stick's price doesn't follow
# what is copied onto it, so copying doesn't print money.

- type: entity
  parent: BaseItem
  id: WFNeurowareStick
  components:
  - type: Sprite
    sprite: _WF/WolfChem/Neuroware/Objects/stick.rsi
    layers:
    - state: body
      color: "#8c8c90"
    - state: plug
    - state: tape
      map: [ "tape" ]
      visible: false
    - state: led
      shader: unshaded
      map: [ "led" ]
      visible: false
  # A blank that takes a copy gets a strip of tape and lights up.
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFNeurowareStickVisuals.Copied:
        tape:
          True: { visible: true }
          False: { visible: false }
        led:
          True: { visible: true }
          False: { visible: false }
  - type: Item
    size: Tiny
  - type: WFNeurowareStick
    loads: 0
  - type: StaticPrice
    price: 75

# A stick with a program on it. It sells like any drug: contraband, and the sale moves money to the black market
# and tips off security.
- type: entity
  abstract: true
  parent: WFNeurowareStick
  id: WFNeurowareStickProgramBase
  components:
  - type: WFNeurowareStick
    loads: 3
  - type: Contraband
    severity: Class3Chem
  - type: ItemTax
    taxAccounts:
      Medical: -0.05
      nfsd: -0.1
      BlackMarket: 0.25
  - type: SoldAlert
    groupId: WFNarcotics
    maxPerSale: 100
    channels:
    - Security
  - type: StaticPrice
    price: 2200

- type: entity
