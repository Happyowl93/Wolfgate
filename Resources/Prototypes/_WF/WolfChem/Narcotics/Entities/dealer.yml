# Street stock the Strangers dealer sells: cut to a low grade, so a cook's own product is worth more.

- type: entity
  parent: WFBaggieCocaine
  id: WFBaggieCocaineCut
  components:
  - type: WFSolutionPurity
    solution: baggie
    reagents:
      WFCocaine: 0.55

- type: entity
  parent: WFBaggieHeroin
  id: WFBaggieHeroinCut
  components:
  - type: WFSolutionPurity
    solution: baggie
    reagents:
      WFHeroin: 0.5

- type: entity
  parent: WFCrackRock
  id: WFCrackRockCut
  components:
  - type: WFSolutionPurity
    solution: food
    reagents:
      WFCrack: 0.5

- type: entity
  parent: WFCrystalShard
  id: WFCrystalShardCut
  components:
  - type: WFSolutionPurity
    solution: food
    reagents:
      Desoxyephedrine: 0.5

# A habit trait's first fix: one cut dose, enough to reach the light tier once.
- type: entity
  parent: WFBaggieCocaineCut
  id: WFBaggieCocaineDose
  suffix: Dose
  components:
  - type: SolutionContainerManager
    solutions:
      baggie:
        maxVol: 10
        reagents:
        - ReagentId: WFCocaine
          Quantity: 3

- type: entity
  parent: WFBaggieHeroinCut
  id: WFBaggieHeroinDose
  suffix: Dose
  components:
  - type: SolutionContainerManager
    solutions:
      baggie:
        maxVol: 10
        reagents:
        - ReagentId: WFHeroin
          Quantity: 3

- type: entity
  parent: WFVialHalo
  id: WFVialHaloDose
  suffix: Halo, Dose
  components:
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 10
        reagents:
        - ReagentId: WFHalo
          Quantity: 3
  - type: WFSolutionPurity
    solution: beaker
    reagents:
      WFHalo: 0.5
