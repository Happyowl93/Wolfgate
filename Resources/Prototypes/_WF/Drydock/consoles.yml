# Drydock berth consoles. The dockmaster offers each one to ships that hail the drydock.
# A console's berth is the cranes multitool-linked to it; the berth label is set per console.
# The traffic console is the dockmaster's shuttle console for hails; it is not a berth console.

- type: entity
  parent: BaseComputer
  id: WFComputerDrydock
  name: drydock console
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shipyard
    - map: ["computerLayerKeys"]
      state: telesci_key
  - type: WFDrydockConsole
    upgrades:
    - WFDrydockThrusters
    - WFDrydockGyroscopes
    - WFDrydockPower
  - type: DeviceLinkSource
    ports:
      - WFDrydockCraneSender
  - type: ActivatableUI
    key: enum.WFDrydockConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.WFDrydockConsoleUiKey.Key:
        type: WFDrydockConsoleBoundUserInterface

- type: entity
  parent: ComputerShuttle
  id: WFComputerDrydockTraffic
  name: drydock traffic console
  description: The dockmaster's console for hails from approaching ships.
