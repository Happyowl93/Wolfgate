# Mobile drydock: a buildable console and crane pair. The console pays in stored materials, not credits (WFDrydockMaterialPayment).
# The mirrored crane shares the plain crane's board.
#
# The crane is a Machine2x2 graph machine on the same four tiles as MachineFrame2x2 (origin, +X, and the two below -Y),
# so a frame on its tile fits it. The arm root sits at ArmRoot -1.5, the body's edge.
# The mirrored crane is the -X image. Deconstructing it yields a frame on the plain footprint, so rebuilding gives the plain crane.

- type: entity
  parent: WFComputerDrydock
  id: WFComputerMobileDrydock
  name: mobile drydock console
  description: A drydock console for ships. Work is paid from materials in its linked cranes or a linked material silo.
  components:
  - type: Computer
    board: WFComputerMobileDrydockCircuitboard
  # Wrenchable and rotatable while unanchored, like a ship machine.
  - type: Anchorable
    flags:
    - Anchorable
    - Unanchorable
  - type: Rotatable
    rotateWhileAnchored: false
  - type: WiresPanel
  - type: WFDrydockConsole
    baseFee: 0
    upgrades:
    - WFDrydockThrusters
    - WFDrydockGyroscopes
    - WFDrydockPower
  - type: WFDrydockMaterialPayment
    rates:
      Steel: 0.2
      Glass: 0.03
      Plastic: 0.03

- type: entity
  parent: BaseComputerCircuitboard
  id: WFComputerMobileDrydockCircuitboard
  name: mobile drydock console board
  components:
  - type: ComputerBoard
    prototype: WFComputerMobileDrydock

- type: entity
  parent: [WFDrydockCrane, ConstructibleMachine]
  id: WFMobileDrydockCrane
  name: mobile drydock crane
  description: A short two-by-two crane for a ship's bay. Works the nearby hull with welders, grinders and bolt drivers.
  components:
  - type: Transform
    anchored: false
  - type: Physics
    bodyType: Dynamic
  # Wrenchable both ways. Restores the flags the station crane base removes.
  - type: Anchorable
    delay: 2
    flags:
    - Anchorable
    - Unanchorable
  - type: Rotatable
    rotateWhileAnchored: false
  - type: WFDrydockCrane
    maxArm: 20
    armRoot: -1.5
    sections: 3
    sectionLength: 4
    extension: 4
    idleLoad: 200
    workingLoad: 6000
  - type: Machine
    board: WFMobileDrydockCraneMachineCircuitboard
  # Two-by-two graph, so deconstruction and breakage give a MachineFrame2x2 on the same tiles.
  # Pries only with the panel open, as on other machines.
  - type: WiresPanel
  - type: Construction
    graph: Machine2x2
    node: machine
  - type: Sprite
    sprite: _WF/Drydock/crane_machine.rsi
    drawdepth: Effects
    noRot: false
    layers:
    - state: machine
      offset: 0.5,-0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-1.5,1.5,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  # Holds the sheets jobs pay with. Like a lathe, can also draw from a linked material silo.
  - type: MaterialStorage
    whitelist:
      tags:
      - Sheet
      - RawMaterial
      - Ingot
  - type: OreSiloClient
  # Medium-voltage draw, for a ship's MV network.
  - type: PowerConsumer
    voltage: Medium
    drawRate: 200
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:TriggerBehavior
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
        - !type:TriggerBehavior
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:ChangeConstructionNodeBehavior
          node: machineFrame

- type: entity
  parent: WFMobileDrydockCrane
  id: WFMobileDrydockCraneMirrored
  suffix: Mirrored
  components:
  - type: Sprite
    sprite: _WF/Drydock/crane_machine.rsi
    drawdepth: Effects
    noRot: false
    layers:
    - state: machine
      offset: -0.5,-0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-1.5,0.5,0.5"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: WFDrydockCrane
    mirrored: true

- type: entity
  parent: BaseMachineCircuitboard
  id: WFMobileDrydockCraneMachineCircuitboard
  name: mobile drydock crane machine board
  components:
  - type: MachineBoard
    prototype: WFMobileDrydockCrane
    requirements:
      Manipulator: 2
      Capacitor: 1
    stackRequirements:
      Steel: 10
      Cable: 5
