# Drydock work sounds, mixed per kind of work so a busy berth sounds like a shipyard

# Hull plating going back on: welding and grinding the seams.
- type: soundCollection
  id: WFDrydockHullWork
  files:
  - /Audio/Items/welder.ogg
  - /Audio/Items/welder2.ogg
  - /Audio/Effects/saw.ogg
  - /Audio/Effects/metal_scrape1.ogg
  - /Audio/Effects/metal_scrape2.ogg
  - /Audio/Items/welder.ogg

# Missing parts rebuilt and bolted down: bolt drivers, ratchets, then a weld.
- type: soundCollection
  id: WFDrydockPartWork
  files:
  - /Audio/Items/drill_use.ogg
  - /Audio/Items/drill_hit.ogg
  - /Audio/Items/ratchet.ogg
  - /Audio/Items/welder2.ogg
  - /Audio/Items/ratchet.ogg
  - /Audio/Items/drill_use.ogg

# Damaged structure patched: welding, grinding and hammering it true.
