# Drydock POI. Loads from gridPath only, so it has no station jobs or bounties.

- type: pointOfInterest
  id: WFDrydock
  parent: BasePOI
  name: 'Drydock'
  minimumDistance: 3500
  maximumDistance: 5500
  spawnGroup: Required
  gridPath: /Maps/_WF/Drydock/drydock.yml
  addComponents:
  - type: IFF
    color: "#E0782A"
  - type: WorldGenDistanceCarver
    distanceThresholds:
    - maxDistance: 800
      prob: 0.0
    - maxDistance: 1500
      prob: 0.3
  # Traffic console: no piloting or FTL of the grid.
  - type: PreventPilot
