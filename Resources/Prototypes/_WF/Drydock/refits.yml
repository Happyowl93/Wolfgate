# Ship refits sold at the drydock. A ship owns a line's tier; each tier swaps the line's machine parts for higher-rated
# ones, so the effect counts machine parts as units. Price and materials are per part (a thruster has 1, a gyroscope 3,
# a SMES 8). Materials run about twice the advanced and super part lathe recipes; Mk III and Mk IV add silver, gold and
# uranium, and Mk IV two bluespace crystals per part.

- type: wfShipRefit
  id: WFRefitThrusters
  name: drydock-upgrade-thrusters
  effect: !type:WFPartRatingRefit
    target: LinearThruster
    ratings: [ 3, 4, 6 ]
  tiers:
  - price: 1000
    materials:
      Steel: 300
      Plastic: 300
      Plasma: 200
      Gold: 150
  - price: 4000
    materials:
      Steel: 400
      Plastic: 400
      Plasma: 200
      Gold: 200
      Silver: 200
      Uranium: 200
      UraniumFissile: 12
  - price: 10000
    materials:
      Plastic: 400
      Plasma: 200
      Gold: 300
      Silver: 300
      Uranium: 300
      Bluespace: 200

