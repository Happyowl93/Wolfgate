# Drydock refit upgrades: each tier swaps a machine's stock parts for higher-rated ones.
# Price and materials are per stock part swapped (a thruster has 1, a gyroscope 3, a SMES 8). Materials run about
# twice the advanced and super part lathe recipes; Mk III and Mk IV add silver, gold and uranium, and Mk IV two
# bluespace crystals per part.

- type: wfDrydockUpgrade
  id: WFDrydockThrusters
  name: drydock-upgrade-thrusters
  target: LinearThruster
  tiers:
  - rating: 3
    price: 1000
    materials:
      Steel: 300
      Plastic: 300
      Plasma: 200
      Gold: 150
  - rating: 4
    price: 4000
    materials:
      Steel: 400
      Plastic: 400
      Plasma: 200
      Gold: 200
      Silver: 200
      Uranium: 200
      UraniumFissile: 12
  - rating: 6
    price: 10000
    materials:
      Plastic: 400
      Plasma: 200
      Gold: 300
      Silver: 300
      Uranium: 300
      Bluespace: 200

