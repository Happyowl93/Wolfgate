      Steel: 300
      Plastic: 300
      Plasma: 150
      Gold: 150
      UraniumFissile: 20
  - rating: 6
    price: 40000
    materials:
      Plastic: 200
      Gold: 100
      Plasma: 100
      Bluespace: 200

