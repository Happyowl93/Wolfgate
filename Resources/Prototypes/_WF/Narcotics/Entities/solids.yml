# Solid drugs. Each keeps its solution's grade, carries Class 3 contraband, and can be ground back down.

- type: entity
  abstract: true
  parent: BaseItem
  id: WFBaseDrugSolid
  components:
  - type: Item
    size: Tiny
  - type: Food
  - type: FlavorProfile
    flavors:
    - bitter
  - type: Extractable
    grindableSolutionName: food
  - type: Contraband
    severity: Class3Chem
    turnInValues:
      FederationMilitaryCredit: 5
  - type: ExaminableSolution
    solution: food
  # Worth its contents at their grade; selling it moves money to the black market and tips off security.
  - type: ItemTax
    taxAccounts:
      Medical: -0.05
      nfsd: -0.1
      BlackMarket: 0.25
  - type: SoldAlert
    groupId: WFNarcotics
    maxPerSale: 100
    channels:
    - Security
  # Fits pipe and bong bowls, and baggies.
  - type: Tag
    tags:
    - Smokable
    - WFNarcotic
    - WFBaggable

- type: entity
  parent: WFBaseDrugSolid
  id: WFCrackRock
  components:
  - type: Sprite
    sprite: _WF/Narcotics/Objects/solids.rsi
    state: crack
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: WFCrack
          Quantity: 5

- type: entity
  parent: WFBaseDrugSolid
  id: WFCrystalShard
  components:
  - type: Sprite
    sprite: _WF/Narcotics/Objects/solids.rsi
    state: crystal
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Desoxyephedrine
          Quantity: 5

# Filled from a scored poppy pod, so it starts empty.
- type: entity
  parent: WFBaseDrugSolid
  id: WFOpiumResin
  components:
  - type: Sprite
    sprite: _WF/Narcotics/Objects/solids.rsi
    state: resin
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15

- type: entity
  parent: WFBaseDrugSolid
  id: WFHashBrick
  components:
  - type: Sprite
    sprite: _WF/Narcotics/Objects/solids.rsi
    state: hash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: THC
          Quantity: 30
  - type: Construction
    graph: WFHash
    node: brick
  # THC carries no price of its own.
  - type: StaticPrice
    price: 120

# Baggies. Craft an empty one from plastic, pour powder in from a beaker or put solid drugs in; filled ones are dealer
# stock.
- type: entity
  parent: BaseStorageItem
  id: WFBaggie
  components:
  - type: Item
    size: Tiny
  # The powder inside takes the colour of what was poured in.
  - type: Sprite
    sprite: _WF/Narcotics/Objects/baggie.rsi
    layers:
    - state: icon
    - state: solid-0
      map: [ "enum.StorageFillLayers.Fill" ]
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: fill-
  - type: Storage
    grid:
    - 0,0,1,1
    maxItemSize: Small
    whitelist:
      tags:
      - WFBaggable
  - type: StorageFillVisualizer
    maxFillLevels: 4
    fillBaseName: solid
  - type: SolutionContainerManager
    solutions:
      baggie:
        maxVol: 10
  - type: RefillableSolution
    solution: baggie
  - type: DrainableSolution
    solution: baggie
  - type: ExaminableSolution
    solution: baggie
  # The storage window only lists solids, so the held baggie shows its powder here.
  - type: SolutionItemStatus
    solution: baggie
  - type: SolutionTransfer
    transferAmount: 5
  - type: Construction
    graph: WFBaggie
    node: baggie
    minTransferAmount: 1
    maxTransferAmount: 10
  - type: Extractable
    grindableSolutionName: baggie
  - type: WFBaggie
    reagents:
    - WFCocaine
    - WFHeroin
    - Desoxyephedrine
    - Ephedrine

- type: entity
  parent: WFBaggie
  id: WFBaggieCocaine
  components:
  - type: SolutionContainerManager
    solutions:
      baggie:
        maxVol: 10
        reagents:
        - ReagentId: WFCocaine
          Quantity: 10
  - type: Contraband
    severity: Class3Chem
    turnInValues:
      FederationMilitaryCredit: 5
  - type: ItemTax
    taxAccounts:
      Medical: -0.05
      nfsd: -0.1
      BlackMarket: 0.25
  - type: SoldAlert
    groupId: WFNarcotics
    maxPerSale: 100
    channels:
    - Security
  - type: Tag
    tags:
    - WFNarcotic

