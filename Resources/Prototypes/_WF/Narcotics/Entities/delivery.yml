# Ways in: powder lines laid from a baggie, and a bong that works from the hand.

- type: entity
  id: WFPowderLine
  components:
  - type: Transform
    noRot: true
  # Tinted by the powder it was laid from.
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _WF/Narcotics/Objects/powder_line.rsi
    layers:
    - state: line-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: line-
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: SolutionContainerManager
    solutions:
      line:
        maxVol: 10
  - type: ExaminableSolution
    solution: line
  - type: WFPowderLine
  # Swept up or blown away like any spill.
  - type: TimedDespawn
    lifetime: 900

- type: entity
  parent: BaseItem
  id: WFBong
  components:
  - type: Sprite
    sprite: _WF/Narcotics/Objects/bong.rsi
    layers:
    - state: icon
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
  - type: Item
    size: Small
    sprite: _WF/Narcotics/Objects/bong.rsi
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 2
    fillBaseName: fill-
  - type: SolutionContainerManager
    solutions:
      water:
        maxVol: 30
  - type: RefillableSolution
    solution: water
  - type: DrainableSolution
    solution: water
  - type: ExaminableSolution
    solution: water
  - type: ContainerContainer
    containers:
      bowl: !type:ContainerSlot
  - type: ItemSlots
  - type: WFBong
    bowl:
      name: wf-bong-bowl
      whitelist:
        tags:
        - Smokable
      insertSound:
        path: /Audio/Weapons/Guns/Empty/empty.ogg
      ejectSound:
        path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: StaticPrice
    price: 40

- type: entity
  parent: WFBong
  id: WFBongFilled
  suffix: Water
  components:
  - type: SolutionContainerManager
    solutions:
      water:
        maxVol: 30
        reagents:
        - ReagentId: Water
          Quantity: 20
