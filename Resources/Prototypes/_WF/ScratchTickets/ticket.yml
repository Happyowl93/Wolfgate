# Three tiers of scratch ticket, each in its own format. Every tier returns about 65% of its price on average; a
# dearer ticket wins less often and pays more when it does. Weights are a tier's symbols and loseWeight together, out of 10000.
- type: entity
  id: WFScratchTicketBase
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _WF/ScratchTickets/ticket.rsi
    layers:
    - state: icon
      map: [ "enum.WFScratchTicketLayers.Base" ]
  - type: Item
    size: Tiny
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WFScratchTicketVisuals.State:
        enum.WFScratchTicketLayers.Base:
          Fresh: { state: icon }
          Lost: { state: lost }
          Won: { state: won }
  - type: ActivatableUI
    key: enum.WFScratchTicketUiKey.Key
    inHandsOnly: true
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.WFScratchTicketUiKey.Key:
        type: WFScratchTicketBoundUserInterface

# Low tier, 500 thalers: wins about one time in three, up to 100 times the price.
- type: entity
  id: WFScratchTicket
  parent: WFScratchTicketBase
  name: Mother Lode scratch ticket
  description: A Caelestinus Prospectors' Lottery ticket. Scratch off the foil, find three ores alike and an ATM pays you the vein.
  components:
  - type: StaticPrice
    price: 25
    vendPrice: 500
  - type: WFScratchTicket
    title: wf-scratch-ticket-mother-lode-title
    tagline: wf-scratch-ticket-mother-lode-tagline
    dud: wf-scratch-ticket-mother-lode-dud
    loseWeight: 6490
    symbols:
    - icon: { sprite: Objects/Materials/ore.rsi, state: diamond }
      prize: 50000
      weight: 10
    - icon: { sprite: Objects/Materials/ore.rsi, state: gold }
      prize: 10000
      weight: 60
    - icon: { sprite: Objects/Materials/ore.rsi, state: silver }
      prize: 2500
      weight: 240
    - icon: { sprite: Objects/Materials/ore.rsi, state: plasma }
      prize: 1000
      weight: 600
    - icon: { sprite: Objects/Materials/ore.rsi, state: uranium }
      prize: 500
      weight: 1200
    - icon: { sprite: Objects/Materials/ore.rsi, state: iron }
      prize: 250
      weight: 1400
    # Spoil: fills cells, pays nothing.
    - icon: { sprite: Objects/Materials/ore.rsi, state: coal }
    - icon: { sprite: Objects/Materials/ore.rsi, state: salt }

# Middle tier, 2500 thalers: wins about two times in nine, never less than the price, up to 200 times it.
- type: entity
  id: WFScratchTicketFoundry
  parent: WFScratchTicketBase
  name: Foundry Gold scratch ticket
  description: A Caelestinus Prospectors' Lottery ticket for steadier nerves. Find the winning ingot among your six and an ATM pays you the cast.
  components:
  - type: Sprite
    sprite: _WF/ScratchTickets/ticket_mid.rsi
  - type: StaticPrice
    price: 125
    vendPrice: 2500
  - type: WFScratchTicket
    title: wf-scratch-ticket-foundry-title
    tagline: wf-scratch-ticket-foundry-tagline
    dud: wf-scratch-ticket-foundry-dud
    format: WinningSymbol
    # Ingot sprites fill their canvas.
    legendIconScale: 1
    cellIconScale: 2
    cardLight: "#C4501A"
    cardDark: "#9A3410"
    cardGlow: "#FFC46A"
    ribbon: "#1E2F6E"
    loseWeight: 7766
    symbols:
    - icon: { sprite: Objects/Materials/ingots.rsi, state: adamantine }
      prize: 500000
      weight: 4
    - icon: { sprite: Objects/Materials/ingots.rsi, state: gold }
      prize: 50000
      weight: 80
    - icon: { sprite: Objects/Materials/ingots.rsi, state: silver }
      prize: 10000
      weight: 350
    - icon: { sprite: Objects/Materials/ingots.rsi, state: copper }
      prize: 5000
      weight: 900
    - icon: { sprite: Objects/Materials/ingots.rsi, state: iron }
      prize: 2500
      weight: 900
    # Slag: fills cells, pays nothing.
    - icon: { sprite: Objects/Materials/materials.rsi, state: ash }
    - icon: { sprite: Objects/Materials/ore.rsi, state: coal }

# High tier, 10000 thalers: wins about one time in eight, never less than 2.5 times the price, up to 500 times it.
- type: entity
  id: WFScratchTicketTycoon
  parent: WFScratchTicketBase
  name: Thaler Tycoon scratch ticket
  description: The Caelestinus Prospectors' Lottery's dearest ticket. Most pay nothing. Two alike in one game and an ATM makes you somebody.
  components:
  - type: Sprite
    sprite: _WF/ScratchTickets/ticket_high.rsi
  - type: StaticPrice
    price: 500
    vendPrice: 10000
  - type: WFScratchTicket
    title: wf-scratch-ticket-tycoon-title
    tagline: wf-scratch-ticket-tycoon-tagline
    dud: wf-scratch-ticket-tycoon-dud
    format: Pairs
    cardLight: "#5B2A91"
    cardDark: "#431C70"
    cardGlow: "#C79BFF"
    ribbon: "#C4261C"
    loseWeight: 8769
    symbols:
    - icon: { sprite: Objects/Economy/cash.rsi, state: cash_1000000 }
      prize: 5000000
      weight: 1
    - icon: { sprite: Objects/Misc/coins.rsi, state: coin_diamond }
      prize: 500000
      weight: 30
    - icon: { sprite: Objects/Misc/coins.rsi, state: coin_adamantine }
      prize: 100000
      weight: 100
    - icon: { sprite: Objects/Misc/coins.rsi, state: coin_gold }
      prize: 50000
      weight: 300
    - icon: { sprite: Objects/Misc/coins.rsi, state: coin_silver }
      prize: 25000
      weight: 800
    # Small change: fills cells, pays nothing.
    - icon: { sprite: Objects/Misc/coins.rsi, state: coin_iron }
    - icon: { sprite: Objects/Economy/cash.rsi, state: cash_10 }
