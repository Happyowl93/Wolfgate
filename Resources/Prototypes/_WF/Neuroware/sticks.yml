# Neuroware sticks. A blank takes copies; the named ones are pristine builds. A stick's price
# doesn't follow what is copied onto it, so copying doesn't print money.

- type: entity
  parent: BaseItem
  id: WFNeurowareStick
  components:
  - type: Sprite
    sprite: _WF/Neuroware/Objects/stick.rsi
    layers:
    - state: body
      color: "#8c8c90"
    - state: plug
  - type: Item
    size: Tiny
  - type: WFNeurowareStick
    loads: 0
  - type: StaticPrice
    price: 20

- type: entity
  parent: WFNeurowareStick
  id: WFNeurowareStickWhiteline
  components:
  - type: Sprite
    layers:
    - state: body
      color: "#f0f0f0"
    - state: plug
    - state: label
    - state: led
      shader: unshaded
  - type: WFNeurowareStick
    profile: WFCocaine
    loads: 3
  - type: Contraband
    severity: Class3Chem
  - type: StaticPrice
    price: 300

