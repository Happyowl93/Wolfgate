# Cyberware Wolfgate adds: the organs, the items its implants fold out, their actions and the autosurgeons that
# install them. augments.yml lists each as a wfAugment.

# Organs

- type: entity
  parent: OrganHumanLiver
  id: WFAugmentScrubberLiver
  name: scrubber liver
  description: A synthetic liver that strips toxins, alcohol and narcotics out of the blood several times faster than flesh does. Stimulants burn off just as fast.
  components:
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [ Human ]
    groups:
    - id: Alcohol
      rateModifier: 4
    - id: Poison
      rateModifier: 4
    - id: Narcotic
      rateModifier: 4
  - type: WolfmedOrgan
    clearanceFactor: 3

# Thermal eyes that cycle through four colour bands. No flash immunity, so a flash still blinds them.
- type: entity
  parent: BaseCyberneticEyes
  id: WFAugmentThermalTintEyes
  name: spectral thermal eyes
  description: Cybernetic eyes that see body heat through walls and the dark, and cycle the view through four colour bands. A flash still gets through.
  components:
  - type: Organ
    onAdd:
    - type: EyeProtection
    - type: ThermalVision
      toggleAction: null
    - type: WFThermalTints
      tints:
      - name: wf-thermal-tint-ember
        color: "#ff6a4d"
        tint: 0.42, 0.12, 0.08
      - name: wf-thermal-tint-glacier
        color: "#6fd6ff"
        tint: 0.06, 0.22, 0.42
      - name: wf-thermal-tint-venom
        color: "#8dff5a"
        tint: 0.1, 0.36, 0.08
      - name: wf-thermal-tint-solar
        color: "#ffd34d"
        tint: 0.4, 0.32, 0.05

# Deployed items

# The tool arm's heads. Each is the hand tool it stands in for, a fifth faster like the omnitool, with its own sprite;
# the inhand sprites stay the hand tool's.

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Screwdriver
  id: WFAugmentToolArmScrewdriver
  name: integrated screwdriver
  description: A powered screwdriver head on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    layers:
    - state: screwdriver
  - type: RandomSprite
    available: []
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Wrench
  id: WFAugmentToolArmWrench
  name: integrated wrench
  description: A powered wrench head on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    state: wrench
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Crowbar
  id: WFAugmentToolArmCrowbar
  name: integrated crowbar
  description: A hydraulic pry bar on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    state: crowbar
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Wirecutter
  id: WFAugmentToolArmWirecutter
  name: integrated wirecutters
  description: Powered cutting jaws on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    layers:
    - state: wirecutter
  - type: RandomSprite
    available: []
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Multitool
  id: WFAugmentToolArmMultitool
  name: integrated multitool
  description: A multitool probe on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    layers:
    - state: multitool
  - type: Item
    sprite: _NF/Objects/Tools/multitool.rsi
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: WelderIndustrial
  id: WFAugmentToolArmWelder
  name: integrated welding tool
  description: A welding torch on the end of a cybernetic forearm, fed from a tank in the arm that is full each time it folds out.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    layers:
    - state: welder
    - state: welder-flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Lighter
  id: WFAugmentFingerLighterFlame
  name: finger lighter
  description: A lighter built into a fingertip.

# Actions

- type: entity
  id: WFActionToggleLeftToolArm
  name: Left Tool Arm
  description: Pick a tool to fold out of your left arm, or the one that is out to fold it back in.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 1
    icon: { sprite: _WF/Augments/tool_arm.rsi, state: implant }
    itemIconStyle: NoItem
    event: !type:WFToggleDeployableImplantEvent

- type: entity
  parent: WFActionToggleLeftToolArm
  id: WFActionToggleRightToolArm
  name: Right Tool Arm
  description: Pick a tool to fold out of your right arm, or the one that is out to fold it back in.
  categories: [ HideSpawnMenu ]

- type: entity
  id: WFActionToggleLeftFingerLighter
  name: Toggle Left Finger Lighter
  description: Flick the lighter out of your left hand's fingertip, or back in.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 1
    icon: { sprite: Objects/Tools/lighters.rsi, state: lighter_flame }
    itemIconStyle: NoItem
    event: !type:WFToggleDeployableImplantEvent

- type: entity
  parent: WFActionToggleLeftFingerLighter
  id: WFActionToggleRightFingerLighter
  name: Toggle Right Finger Lighter
  description: Flick the lighter out of your right hand's fingertip, or back in.
  categories: [ HideSpawnMenu ]

- type: entity
  id: WFActionIatricScan
  name: Iatric Monitor
  description: Read your own vital signs off the monitor behind your eye, or put the readout away.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 1
    checkCanInteract: false
    icon: { sprite: _WF/Augments/implants.rsi, state: iatric_monitor }
    itemIconStyle: NoItem
    event: !type:WFIatricScanEvent
  - type: HealthAnalyzer
    silent: true
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: WFIatricScanner

- type: entity
  id: WFActionCycleThermalTint
  name: Cycle Thermal Band
  description: Switch your thermal eyes to their next colour band, or off after the last.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 0.5
    checkCanInteract: false
    icon: { sprite: _White/Clothing/Eyes/Goggles/thermal.rsi, state: icon }
    itemIconStyle: NoItem
    event: !type:WFCycleThermalTintEvent

# Autosurgeons

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftToolArm
  name: autosurgeon (left tool arm)
  description: Builds a set of tools into the left forearm, to fold out one at a time on command.
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: WFToolArm
      items:
      - WFAugmentToolArmScrewdriver
      - WFAugmentToolArmWrench
      - WFAugmentToolArmWelder
      - WFAugmentToolArmCrowbar
      - WFAugmentToolArmWirecutter
      - WFAugmentToolArmMultitool
      action: WFActionToggleLeftToolArm
      deploySound: /Audio/Items/change_drill.ogg
      retractSound: /Audio/Items/change_drill.ogg

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightToolArm
  name: autosurgeon (right tool arm)
  description: Builds a set of tools into the right forearm, to fold out one at a time on command.
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: WFToolArm
      items:
      - WFAugmentToolArmScrewdriver
      - WFAugmentToolArmWrench
      - WFAugmentToolArmWelder
      - WFAugmentToolArmCrowbar
      - WFAugmentToolArmWirecutter
      - WFAugmentToolArmMultitool
      action: WFActionToggleRightToolArm
      deploySound: /Audio/Items/change_drill.ogg
      retractSound: /Audio/Items/change_drill.ogg

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftSmartlink
  name: autosurgeon (left smartlink)
  description: Wires the left hand to the gun it holds, compensating for its recoil.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: WFSmartlink

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightSmartlink
  name: autosurgeon (right smartlink)
  description: Wires the right hand to the gun it holds, compensating for its recoil.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: WFSmartlink

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftFingerLighter
  name: autosurgeon (left finger lighter)
  description: Fits a lighter into a fingertip of the left hand.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: WFFingerLighter
      items: [ WFAugmentFingerLighterFlame ]
      action: WFActionToggleLeftFingerLighter

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightFingerLighter
  name: autosurgeon (right finger lighter)
  description: Fits a lighter into a fingertip of the right hand.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: WFFingerLighter
      items: [ WFAugmentFingerLighterFlame ]
      action: WFActionToggleRightFingerLighter

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonAdrenalBooster
  name: autosurgeon (adrenal booster)
  description: Wires a booster into the adrenal glands, for more stamina that comes back sooner.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: Vigor

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonPainEditor
  name: autosurgeon (pain editor)
  description: Fits a pain editor to the brainstem, dulling the pain of every wound.
  components:
  - type: AutoSurgeon
    targetBodyPart: Head
    componentsToUser:
    - type: WFPainEditor

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftThreatSole
  name: autosurgeon (left threat-sense sole)
  description: Lines the left sole with sensors that keep its owner from setting off floor traps.
  components:
  - type: AutoSurgeon
    targetBodyPart: Foot
    targetBodyPartSymmetry: Left
    componentsToUser:
    - type: TrapAvoider

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightThreatSole
  name: autosurgeon (right threat-sense sole)
  description: Lines the right sole with sensors that keep its owner from setting off floor traps.
  components:
  - type: AutoSurgeon
    targetBodyPart: Foot
    targetBodyPartSymmetry: Right
    componentsToUser:
    - type: TrapAvoider

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonNutrimentPump
  name: autosurgeon (nutriment pump)
  description: Fits a nutriment pump beside the stomach, which feeds its owner whenever they are starving.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: WFNutrimentPump

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonReviver
  name: autosurgeon (reviver)
  description: Wires a reviver to the heart, which shocks it when it stops.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: WFReviver

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonIatricMonitor
  name: autosurgeon (iatric monitor)
  description: Fits an iatric monitor behind the eye, which shows its owner their own vital signs.
  components:
  - type: AutoSurgeon
    targetBodyPart: Head
    componentsToUser:
    - type: WFIatricMonitor
