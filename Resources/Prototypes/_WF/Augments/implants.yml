# Cyberware Wolfgate adds: the organs, the items its implants fold out, their actions and the autosurgeons that
# install them. augments.yml lists each as a wfAugment.

# Organs

- type: entity
  parent: OrganHumanLiver
  id: WFAugmentScrubberLiver
  name: scrubber liver
  description: A synthetic liver that strips toxins, alcohol and narcotics out of the blood several times faster than flesh does. Stimulants burn off just as fast.
  components:
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [ Human ]
    groups:
    - id: Alcohol
      rateModifier: 4
    - id: Poison
      rateModifier: 4
    - id: Narcotic
      rateModifier: 4
  - type: WolfmedOrgan
    clearanceFactor: 3

# Deployed items

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Omnitool
  id: WFAugmentToolArmTool
  name: integrated omnitool
  description: A powered tool head on the end of a cybernetic forearm.

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Lighter
  id: WFAugmentFingerLighterFlame
  name: finger lighter
  description: A lighter built into a fingertip.

# Actions

- type: entity
  id: WFActionToggleLeftToolArm
  name: Toggle Left Tool Arm
  description: Fold the omnitool out of your left arm, or back in.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 2
    icon: { sprite: Objects/Tools/omnitool.rsi, state: omnitool-screwing }
    itemIconStyle: NoItem
    event: !type:WFToggleDeployableImplantEvent

- type: entity
  parent: WFActionToggleLeftToolArm
  id: WFActionToggleRightToolArm
  name: Toggle Right Tool Arm
  description: Fold the omnitool out of your right arm, or back in.
  categories: [ HideSpawnMenu ]

- type: entity
  id: WFActionToggleLeftFingerLighter
  name: Toggle Left Finger Lighter
  description: Flick the lighter out of your left hand's fingertip, or back in.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 1
    icon: { sprite: Objects/Tools/lighters.rsi, state: lighter_flame }
    itemIconStyle: NoItem
    event: !type:WFToggleDeployableImplantEvent

- type: entity
  parent: WFActionToggleLeftFingerLighter
  id: WFActionToggleRightFingerLighter
  name: Toggle Right Finger Lighter
  description: Flick the lighter out of your right hand's fingertip, or back in.
  categories: [ HideSpawnMenu ]

# Autosurgeons

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftToolArm
  name: autosurgeon (left tool arm)
  description: Builds an omnitool into the left forearm, to fold out on command.
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: WFToolArm
      item: WFAugmentToolArmTool
      action: WFActionToggleLeftToolArm
      deploySound: /Audio/Items/change_drill.ogg
      retractSound: /Audio/Items/change_drill.ogg

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightToolArm
  name: autosurgeon (right tool arm)
  description: Builds an omnitool into the right forearm, to fold out on command.
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: WFToolArm
      item: WFAugmentToolArmTool
      action: WFActionToggleRightToolArm
      deploySound: /Audio/Items/change_drill.ogg
      retractSound: /Audio/Items/change_drill.ogg

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftSmartlink
  name: autosurgeon (left smartlink)
  description: Wires the left hand to the gun it holds, tightening its spread.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: WFSmartlink

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightSmartlink
  name: autosurgeon (right smartlink)
  description: Wires the right hand to the gun it holds, tightening its spread.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: WFSmartlink

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftFingerLighter
  name: autosurgeon (left finger lighter)
  description: Fits a lighter into a fingertip of the left hand.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: WFFingerLighter
      item: WFAugmentFingerLighterFlame
      action: WFActionToggleLeftFingerLighter

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightFingerLighter
  name: autosurgeon (right finger lighter)
  description: Fits a lighter into a fingertip of the right hand.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: WFFingerLighter
      item: WFAugmentFingerLighterFlame
      action: WFActionToggleRightFingerLighter
