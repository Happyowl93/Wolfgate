# Cyberware Wolfgate adds: the organs, the items its implants fold out, their actions and the autosurgeons that
# install them. augments.yml lists each as a wfAugment.

# Organs

- type: entity
  parent: OrganHumanLiver
  id: WFAugmentScrubberLiver
  name: PD-VI HF-12 prosthetic liver
  description: A synthetic liver that strips toxins, alcohol and narcotics out of the blood several times faster than flesh does. Stimulants burn off just as fast.
  components:
  - type: Sprite
    sprite: _WF/Augments/implants.rsi
    state: scrubber_liver
  - type: Item
    sprite: Mobs/Species/Human/organs.rsi # the flesh liver's inhands; there are no synthetic ones
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [ Human ]
    groups:
    - id: Alcohol
      rateModifier: 4
    - id: Poison
      rateModifier: 4
    - id: Narcotic
      rateModifier: 4
  - type: WolfmedOrgan
    clearanceFactor: 3

# Eyes that cycle a thermal band and three night-vision phosphors. No flash immunity, so a flash still blinds them.
- type: entity
  parent: BaseCyberneticEyes
  id: WFAugmentThermalTintEyes
  name: PD-VI OV-40 "Tapetum" ocular suite
  description: Prosthetic eyes with a thermal band that sees body heat through walls, and three night-vision phosphors. A flash still gets through.
  components:
  - type: Organ
    onAdd:
    - type: EyeProtection
    - type: ThermalVision
      toggleAction: null
    # The phosphor only shows through the goggle shader; one lens far wider than the screen keeps its edges clear.
    - type: NightVision
      lightingColor: "#FFFFFF32"
      goggleEffect: true
      viewCircleCount: 1
      viewCircleRadius: 100000
    - type: WFThermalTints
      tints:
      - color: "#ff6a4d" # thermal
        tint: 0.42, 0.12, 0.08
      - nightVision: true # green phosphor
        color: "#5cff6e"
      - nightVision: true # Gen 4 cyan phosphor
        color: "#41D7D9"
      - nightVision: true # white phosphor
        color: "#FFE4B3"

# Deployed items

# The tool arm's heads. Each is the hand tool it stands in for, a fifth faster like the omnitool, with its own sprite;
# the inhand sprites stay the hand tool's.

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Screwdriver
  id: WFAugmentToolArmScrewdriver
  name: integrated screwdriver
  description: A powered screwdriver head on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    layers:
    - state: screwdriver
  - type: RandomSprite
    available: []
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Wrench
  id: WFAugmentToolArmWrench
  name: integrated wrench
  description: A powered wrench head on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    state: wrench
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Crowbar
  id: WFAugmentToolArmCrowbar
  name: integrated crowbar
  description: A hydraulic pry bar on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    state: crowbar
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Wirecutter
  id: WFAugmentToolArmWirecutter
  name: integrated wirecutters
  description: Powered cutting jaws on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    layers:
    - state: wirecutter
  - type: RandomSprite
    available: []
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Multitool
  id: WFAugmentToolArmMultitool
  name: integrated multitool
  description: A multitool probe on the end of a cybernetic forearm.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    layers:
    - state: multitool
  - type: Item
    sprite: _NF/Objects/Tools/multitool.rsi
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: WelderIndustrial
  id: WFAugmentToolArmWelder
  name: integrated welding tool
  description: A welding torch on the end of a cybernetic forearm, fed from a tank in the arm that is full each time it folds out.
  components:
  - type: Sprite
    sprite: _WF/Augments/tool_arm.rsi
    layers:
    - state: welder
    - state: welder-flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Tool
    speedModifier: 1.2

- type: entity
  categories: [ DoNotMap, HideSpawnMenu ]
  parent: Lighter
  id: WFAugmentFingerLighterFlame
  name: finger lighter
  description: A lighter built into a fingertip.

# The Corona's charges, thrown out in a ring; WFBurstLauncherSystem sets them off together. The shield holds the wearer meanwhile.
- type: entity
  abstract: true
  id: WFHaloOrbBase
  name: corona charge
  description: An amber charge hanging in the air, about to go off.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Augments/halo_orb.rsi
    state: orb
    drawdepth: Effects
    shader: unshaded
    noRot: true
  - type: PointLight
    color: "#ffa733"
    radius: 1.5
    energy: 1.5
  - type: Physics
    bodyType: Dynamic
    fixedRotation: true
  - type: Fixtures
    fixtures:
      orb: # stops at walls and passes people
        shape: !type:PhysShapeCircle
          radius: 0.1
        density: 1
        hard: true
        mask:
        - Impassable
  - type: TimedDespawn # in case the fuse is missed
    lifetime: 4

- type: entity
  parent: WFHaloOrbBase
  id: WFHaloOrbLethal
  categories: [ HideSpawnMenu ]
  components:
  - type: WFHaloOrb
    damage:
      types:
        Piercing: 15
        Heat: 10
  - type: WolfmedDamageCause
    cause: Explosion

- type: entity
  parent: WFHaloOrbBase
  id: WFHaloOrbStun
  categories: [ HideSpawnMenu ]
  components:
  - type: WFHaloOrb
    staminaDamage: 40

- type: entity
  id: WFHaloShield
  name: corona shield
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _WF/Augments/halo_shield.rsi
    state: shield
    drawdepth: Effects
    shader: unshaded
    noRot: true
  - type: PointLight
    color: "#ffd84a"
    radius: 2
    energy: 1
  - type: TimedDespawn # in case the fuse is missed
    lifetime: 3

- type: entity
  id: WFHaloBlast
  name: corona blast
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Effects/explosion.rsi
    state: explosionfast
    scale: 0.8, 0.8 # the blast's reach
    drawdepth: Effects
    noRot: true
    shader: unshaded
  - type: TimedDespawn
    lifetime: 0.48
  - type: PointLight
    color: "#ffa733"
    radius: 2.5
    energy: 2

# Actions

- type: entity
  id: WFActionToggleLeftToolArm
  name: Left Tool Arm
  description: Pick a tool to fold out of your left arm, or the one that is out to fold it back in.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 1
    icon: { sprite: _WF/Augments/tool_arm.rsi, state: implant }
    itemIconStyle: NoItem
    event: !type:WFToggleDeployableImplantEvent

- type: entity
  parent: WFActionToggleLeftToolArm
  id: WFActionToggleRightToolArm
  name: Right Tool Arm
  description: Pick a tool to fold out of your right arm, or the one that is out to fold it back in.
  categories: [ HideSpawnMenu ]

- type: entity
  id: WFActionToggleLeftFingerLighter
  name: Toggle Left Finger Lighter
  description: Flick the lighter out of your left hand's fingertip, or back in.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 1
    icon: { sprite: Objects/Tools/lighters.rsi, state: lighter_flame }
    itemIconStyle: NoItem
    event: !type:WFToggleDeployableImplantEvent

- type: entity
  parent: WFActionToggleLeftFingerLighter
  id: WFActionToggleRightFingerLighter
  name: Toggle Right Finger Lighter
  description: Flick the lighter out of your right hand's fingertip, or back in.
  categories: [ HideSpawnMenu ]

- type: entity
  id: WFActionIatricScan
  name: Vitals Readout
  description: Read your own vital signs off the monitor behind your eye, or put the readout away.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 1
    checkCanInteract: false
    icon: { sprite: _WF/Augments/implants.rsi, state: iatric_monitor }
    itemIconStyle: NoItem
    event: !type:WFIatricScanEvent
  - type: HealthAnalyzer
    silent: true
  - type: UserInterface
    interfaces:
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: WFIatricScanner

- type: entity
  id: WFActionCycleThermalTint
  name: Cycle Vision
  description: Switch your eyes to their next mode, thermal then each night-vision phosphor, or off after the last.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 0.5
    checkCanInteract: false
    icon: { sprite: _White/Clothing/Eyes/Goggles/thermal.rsi, state: icon }
    itemIconStyle: NoItem
    event: !type:WFCycleThermalTintEvent

- type: entity
  id: WFActionHaloBurst
  name: Corona Frag
  description: Throw a ring of explosive charges out round you; they go off together two seconds later, while you are held in a shield. Holds two bursts; each comes back on its own.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    charges: 2
    icon: { sprite: Objects/Weapons/Grenades/shrapnelgrenade.rsi, state: icon }
    itemIconStyle: NoItem
    event: !type:WFFireBurstLauncherEvent

- type: entity
  parent: WFActionHaloBurst
  id: WFActionHaloStun
  name: Corona Concussion
  description: Throw a ring of concussive charges out round you; they go off together two seconds later, while you are held in a shield. Holds two bursts; each comes back on its own.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    charges: 2
    icon: { sprite: Objects/Weapons/Grenades/stingergrenade.rsi, state: icon }
    itemIconStyle: NoItem
    event: !type:WFFireBurstLauncherEvent

# Autosurgeons

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftToolArm
  name: autosurgeon (left RM-5 "Verstak")
  description: Builds a set of tools into the left forearm, to fold out one at a time on command.
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: WFToolArm
      items:
      - WFAugmentToolArmScrewdriver
      - WFAugmentToolArmWrench
      - WFAugmentToolArmWelder
      - WFAugmentToolArmCrowbar
      - WFAugmentToolArmWirecutter
      - WFAugmentToolArmMultitool
      action: WFActionToggleLeftToolArm
      deploySound: /Audio/Items/change_drill.ogg
      retractSound: /Audio/Items/change_drill.ogg

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightToolArm
  name: autosurgeon (right RM-5 "Verstak")
  description: Builds a set of tools into the right forearm, to fold out one at a time on command.
  components:
  - type: AutoSurgeon
    targetBodyPart: Arm
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: WFToolArm
      items:
      - WFAugmentToolArmScrewdriver
      - WFAugmentToolArmWrench
      - WFAugmentToolArmWelder
      - WFAugmentToolArmCrowbar
      - WFAugmentToolArmWirecutter
      - WFAugmentToolArmMultitool
      action: WFActionToggleRightToolArm
      deploySound: /Audio/Items/change_drill.ogg
      retractSound: /Audio/Items/change_drill.ogg

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftSmartlink
  name: autosurgeon (left SL-4 "Shojun")
  description: Wires the left hand to the gun it holds, compensating for its recoil.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: WFSmartlink

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightSmartlink
  name: autosurgeon (right SL-4 "Shojun")
  description: Wires the right hand to the gun it holds, compensating for its recoil.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: WFSmartlink

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftFingerLighter
  name: autosurgeon (left HB-2 "Hibana")
  description: Fits a lighter into a fingertip of the left hand.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Left
    componentsToPart:
    - type: WFFingerLighter
      items: [ WFAugmentFingerLighterFlame ]
      action: WFActionToggleLeftFingerLighter

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightFingerLighter
  name: autosurgeon (right HB-2 "Hibana")
  description: Fits a lighter into a fingertip of the right hand.
  components:
  - type: AutoSurgeon
    targetBodyPart: Hand
    targetBodyPartSymmetry: Right
    componentsToPart:
    - type: WFFingerLighter
      items: [ WFAugmentFingerLighterFlame ]
      action: WFActionToggleRightFingerLighter

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonAdrenalBooster
  name: autosurgeon (KR-14 "Ryvok")
  description: Wires a booster into the adrenal glands, for more stamina and a second wind when a stun drops its owner.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: Vigor
    - type: WFAdrenalBooster

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonPainEditor
  name: autosurgeon (EVT-130 "Mushin")
  description: Fits a pain inhibitor to the brainstem, dulling the pain of every wound.
  components:
  - type: AutoSurgeon
    targetBodyPart: Head
    componentsToUser:
    - type: WFPainEditor

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonLeftThreatSole
  name: autosurgeon (left SP-9 "Sapyor")
  description: Lines the left sole with sensors that keep its owner from setting off floor traps.
  components:
  - type: AutoSurgeon
    targetBodyPart: Foot
    targetBodyPartSymmetry: Left
    componentsToUser:
    - type: TrapAvoider

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonRightThreatSole
  name: autosurgeon (right SP-9 "Sapyor")
  description: Lines the right sole with sensors that keep its owner from setting off floor traps.
  components:
  - type: AutoSurgeon
    targetBodyPart: Foot
    targetBodyPartSymmetry: Right
    componentsToUser:
    - type: TrapAvoider

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonNutrimentPump
  name: autosurgeon (PN-3 "Paek")
  description: Fits a nutriment pump beside the stomach, which feeds its owner whenever they are starving.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: WFNutrimentPump

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonReviver
  name: autosurgeon (EVT-090 "Fukkatsu")
  description: Wires a cardiac reviver to the heart, which shocks it when it stops.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: WFReviver

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonIatricMonitor
  name: autosurgeon (EVT-120 "Kanshi")
  description: Fits a vitals monitor behind the eye, which shows its owner their own vital signs.
  components:
  - type: AutoSurgeon
    targetBodyPart: Head
    componentsToUser:
    - type: WFIatricMonitor

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonHaloBurst
  name: autosurgeon (KR-30 "Corona")
  description: Packs explosive charges round the ribcage, to be thrown out in a ring.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: WFHaloBurst
      orb: WFHaloOrbLethal
      action: WFActionHaloBurst

- type: entity
  parent: BaseAutosurgeon
  id: WFAutosurgeonHaloStun
  name: autosurgeon (KR-31 "Corona")
  description: Packs concussive charges round the ribcage, to be thrown out in a ring.
  components:
  - type: AutoSurgeon
    targetBodyPart: Torso
    componentsToUser:
    - type: WFHaloStun
      orb: WFHaloOrbStun
      action: WFActionHaloStun
