# The cyberware found, bought and installed in rounds. Each is bought once in the creator or kept from a round
# it was installed in; scavengers find the part, organ or autosurgeon, rarer the dearer it is. Better limbs hold more
# implants (implantSlots); an implant's slot is the part it goes in, and host says whether that part must be synthetic.
# The creator draws the installed entity's sprite beside each; autosurgeons all look alike, so implants name an icon.

- type: wfAugment
  id: WFAugmentJawsOfLifeLeftArm
  slot: LeftArm
  kind: Limb
  part: JawsOfLifeLeftArm
  styled: true
  price: 200000
  implantSlots: 2
  order: 10

