# One scavenged augment, picked from augments.yml by price: the bare part or organ, or the autosurgeon for an
# upgrade. Nested into the rare tiers of the maintenance loot tables.

- type: entityTable
  id: WFAugmentScavengeTable
  table: !type:WFAugmentSelector {}

- type: entity
  parent: MarkerBase
  id: WFAugmentScavengeSpawner
  name: scavenged augment spawner
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _EinsteinEngines/Mobs/Species/Cybernetics/bishop/bishop_main.rsi
      state: r_arm-combined
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: WFAugmentScavengeTable
